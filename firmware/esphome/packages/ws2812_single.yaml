


light:
  - platform: esp32_rmt_led_strip
    id: status_pixel
    pin: ${pixel_pin}
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    internal: true
    default_transition_length: 250ms

script:
  - id: pulse_led_startup
    then:
      - delay: 500ms
      - light.turn_on:
          id: status_pixel
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
      - delay: 1000ms
      - light.turn_on:
          id: status_pixel
          brightness: 50%
          red: 0%
          green: 100%
          blue: 0%
      - delay: 1000ms
      - light.turn_on:
          id: status_pixel
          brightness: 50%
          red: 0%
          green: 0%
          blue: 100%
      - delay: 1000ms
      - light.turn_off:
          id: status_pixel


